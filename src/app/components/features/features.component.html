<section id="features" class="relative py-20 px-4 sm:px-6 lg:px-8 bg-white overflow-hidden">
    <app-background-elements variant="features" />

    <div class="max-w-7xl mx-auto">
        <app-scroll-animation variant="fadeIn" class="text-center mb-16 block">
            <h2 class="text-3xl sm:text-4xl mb-4">Características</h2>
            <p class="text-xl text-muted-foreground max-w-3xl mx-auto">
                Capacidades integrales de gestión de nómina diseñadas para empresas modernas
            </p>
        </app-scroll-animation>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <div *ngFor="let feature of features; let i = index"
                class="group transition-all duration-700 ease-out transform hover:-translate-y-1"
                [style.transition-delay]="(i * 100) + 'ms'">
                <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 h-full flex flex-col hover:shadow-md transition"
                    [style.box-shadow]="getHoverShadow()">
                    <div class="space-y-4">
                        <!-- Image -->
                        <div class="rounded-xl overflow-hidden transition-transform duration-300 hover:scale-105">
                            <img [src]="feature.image" [alt]="feature.title" class="w-full h-36 object-cover rounded-lg" />
                        </div>

                        <!-- Icon -->
                        <div class="w-10 h-10 bg-gray-100 text-gray-700 rounded-full flex items-center justify-center">
                            <ng-container [ngSwitch]="feature.icon">
                                <!-- Globe Icon -->
                                <svg *ngSwitchCase="'globe'" class="w-6 h-6 text-primary" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9">
                                    </path>
                                </svg>
                                <!-- Brain Icon -->
                                <svg *ngSwitchCase="'brain'" class="w-6 h-6 text-primary" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z">
                                    </path>
                                </svg>
                                <!-- Settings Icon -->
                                <svg *ngSwitchCase="'settings'" class="w-6 h-6 text-primary" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                                    </path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                <!-- BarChart3 Icon -->
                                <svg *ngSwitchCase="'barchart3'" class="w-6 h-6 text-primary" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                                    </path>
                                </svg>
                                <!-- Shield Icon -->
                                <svg *ngSwitchCase="'shield'" class="w-6 h-6 text-primary" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                                    </path>
                                </svg>
                                <!-- Building Icon -->
                                <svg *ngSwitchCase="'building'" class="w-6 h-6 text-primary" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                                    </path>
                                </svg>
                                <!-- Monitor Icon -->
                                <svg *ngSwitchCase="'monitor'" class="w-6 h-6 text-primary" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                    </path>
                                </svg>
                                <!-- Plug Icon -->
                                <svg *ngSwitchCase="'plug'" class="w-6 h-6 text-primary" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v1m0 0V5a2 2 0 012-2h4a2 2 0 012 2v1M7 21h10a2 2 0 002-2v-1a2 2 0 00-2-2H7a2 2 0 00-2 2v1a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </ng-container>
                        </div>

                        <!-- Content -->
                        <div class="space-y-2">
                            <h3 class="text-base font-semibold text-gray-900">{{ feature.title }}</h3>
                            <p class="text-sm text-gray-500 leading-normal">
                                {{ feature.description }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
