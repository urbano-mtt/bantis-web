<footer class="bg-primary text-primary-foreground">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-8">
            <!-- Brand -->
            <app-scroll-animation variant="slideUp" class="lg:col-span-2 block">
                <h3 class="text-2xl mb-4 text-primary-foreground transition-transform duration-200 hover:scale-105">
                    Bantis
                </h3>
                <p class="text-primary-foreground/70 mb-6 max-w-md">
                    Simplifica tu nómina con tecnología flexible y
                    potente. Bantis procesa lo complejo, tú decides el
                    ritmo.
                </p>

                <!-- Social Links -->
                <div class="flex gap-4">
                    <a *ngFor="let social of socialLinks; let i = index" [href]="social.href"
                        [attr.aria-label]="social.label"
                        class="w-10 h-10 bg-primary-foreground/10 rounded-lg flex items-center justify-center hover:bg-accent hover:text-accent-foreground transition-all duration-300 hover:scale-110 hover:-translate-y-0.5 active:scale-95">
                        <ng-container [ngSwitch]="social.icon">
                            <!-- Facebook Icon -->
                            <svg *ngSwitchCase="'facebook'" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                            </svg>
                            <!-- Twitter Icon -->
                            <svg *ngSwitchCase="'twitter'" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z" />
                            </svg>
                            <!-- LinkedIn Icon -->
                            <svg *ngSwitchCase="'linkedin'" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                            </svg>
                            <!-- Instagram Icon -->
                            <svg *ngSwitchCase="'instagram'" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M12.017 0C8.396 0 7.989.013 7.041.048 6.094.082 5.48.204 4.955.388a5.426 5.426 0 0 0-1.962 1.277A5.432 5.432 0 0 0 1.716 3.627c-.184.526-.306 1.14-.34 2.087C1.341 6.662 1.328 7.069 1.328 10.69s.013 4.028.048 4.976c.034.947.156 1.561.34 2.087a5.428 5.428 0 0 0 1.277 1.962c.59.59 1.254 1.002 1.962 1.277.526.184 1.14.306 2.087.34.948.035 1.355.048 4.976.048s4.028-.013 4.976-.048c.947-.034 1.561-.156 2.087-.34a5.426 5.426 0 0 0 1.962-1.277 5.432 5.432 0 0 0 1.277-1.962c.184-.526.306-1.14.34-2.087.035-.948.048-1.355.048-4.976s-.013-4.028-.048-4.976c-.034-.947-.156-1.561-.34-2.087a5.428 5.428 0 0 0-1.277-1.962A5.426 5.426 0 0 0 19.114.388c-.526-.184-1.14-.306-2.087-.34C16.079.013 15.672 0 12.051 0h-.034zm-.017 1.76h.044c3.569 0 3.999.012 5.414.048.848.036 1.306.166 1.612.275.405.156.695.344.999.648.304.304.492.594.648.999.109.306.239.764.275 1.612.036 1.415.048 1.845.048 5.414s-.012 3.999-.048 5.414c-.036.848-.166 1.306-.275 1.612a2.678 2.678 0 0 1-.648.999c-.304.304-.594.492-.999.648-.306.109-.764.239-1.612.275-1.415.036-1.845.048-5.414.048s-3.999-.012-5.414-.048c-.848-.036-1.306-.166-1.612-.275a2.678 2.678 0 0 1-.999-.648 2.678 2.678 0 0 1-.648-.999c-.109-.306-.239-.764-.275-1.612-.036-1.415-.048-1.845-.048-5.414s.012-3.999.048-5.414c.036-.848.166-1.306.275-1.612.156-.405.344-.695.648-.999a2.678 2.678 0 0 1 .999-.648c.306-.109.764-.239 1.612-.275 1.415-.036 1.845-.048 5.414-.048z" />
                                <path
                                    d="M12.017 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12.017 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z" />
                            </svg>
                        </ng-container>
                    </a>
                </div>
            </app-scroll-animation>

            <!-- Product -->
            <app-scroll-animation variant="slideUp" [delay]="0.1" class="block">
                <h4 class="text-lg mb-4 text-primary-foreground">Producto</h4>
                <ul class="space-y-3">
                    <li *ngFor="let item of navigation.product; let i = index" class="transition-all duration-300"
                        [class.opacity-100]="isVisible" [class.translate-x-0]="isVisible" [class.opacity-0]="!isVisible"
                        [class.-translate-x-2.5]="!isVisible" [style.transition-delay]="(i * 50) + 'ms'">
                        <a [href]="item.href"
                            class="text-primary-foreground/70 hover:text-primary-foreground transition-all duration-200 hover:translate-x-1">
                            {{ item.name }}
                        </a>
                    </li>
                </ul>
            </app-scroll-animation>

            <!-- Support -->
            <app-scroll-animation variant="slideUp" [delay]="0.2" class="block">
                <h4 class="text-lg mb-4 text-primary-foreground">Soporte</h4>
                <ul class="space-y-3">
                    <li *ngFor="let item of navigation.support; let i = index" class="transition-all duration-300"
                        [class.opacity-100]="isVisible" [class.translate-x-0]="isVisible" [class.opacity-0]="!isVisible"
                        [class.-translate-x-2.5]="!isVisible" [style.transition-delay]="(i * 50) + 'ms'">
                        <a [href]="item.href"
                            class="text-primary-foreground/70 hover:text-primary-foreground transition-all duration-200 hover:translate-x-1">
                            {{ item.name }}
                        </a>
                    </li>
                </ul>
            </app-scroll-animation>

            <!-- Company -->
            <app-scroll-animation variant="slideUp" [delay]="0.3" class="block">
                <h4 class="text-lg mb-4 text-primary-foreground">Empresa</h4>
                <ul class="space-y-3">
                    <li *ngFor="let item of navigation.company; let i = index" class="transition-all duration-300"
                        [class.opacity-100]="isVisible" [class.translate-x-0]="isVisible" [class.opacity-0]="!isVisible"
                        [class.-translate-x-2.5]="!isVisible" [style.transition-delay]="(i * 50) + 'ms'">
                        <a [href]="item.href"
                            class="text-primary-foreground/70 hover:text-primary-foreground transition-all duration-200 hover:translate-x-1">
                            {{ item.name }}
                        </a>
                    </li>
                </ul>
            </app-scroll-animation>

            <!-- Legal -->
            <app-scroll-animation variant="slideUp" [delay]="0.4" class="block">
                <h4 class="text-lg mb-4 text-primary-foreground">Legal</h4>
                <ul class="space-y-3">
                    <li *ngFor="let item of navigation.legal; let i = index" class="transition-all duration-300"
                        [class.opacity-100]="isVisible" [class.translate-x-0]="isVisible" [class.opacity-0]="!isVisible"
                        [class.-translate-x-2.5]="!isVisible" [style.transition-delay]="(i * 50) + 'ms'">
                        <a [href]="item.href"
                            class="text-primary-foreground/70 hover:text-primary-foreground transition-all duration-200 hover:translate-x-1">
                            {{ item.name }}
                        </a>
                    </li>
                </ul>
            </app-scroll-animation>
        </div>

        <!-- Bottom Section -->
        <app-scroll-animation variant="fadeIn" [delay]="0.5" class="block">
            <div class="mt-12 pt-8 border-t border-primary-foreground/20">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="text-primary-foreground/70 transition-opacity duration-500"
                        [class.opacity-100]="isBottomVisible" [class.opacity-0]="!isBottomVisible">
                        © 2024 Bantis. Todos los derechos reservados.
                    </div>

                    <div class="flex flex-wrap gap-6 text-sm text-primary-foreground/70 transition-all duration-500"
                        [class.opacity-100]="isBottomVisible" [class.translate-y-0]="isBottomVisible"
                        [class.opacity-0]="!isBottomVisible" [class.translate-y-2.5]="!isBottomVisible"
                        style="transition-delay: 200ms">
                        <a *ngFor="let item of bottomLinks" href="#"
                            class="hover:text-primary-foreground transition-all duration-200 hover:-translate-y-0.5">
                            {{ item }}
                        </a>
                    </div>
                </div>
            </div>
        </app-scroll-animation>
    </div>
</footer>
