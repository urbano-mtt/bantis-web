<header class="hs-header sticky top-0 z-50 bg-white shadow-sm rounded-b-xl">
    <nav class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
        <!-- Logo -->
        <div class="flex-shrink-0">
            <h1 class="text-[color:var(--primary)] font-semibold text-lg">Bantis</h1>
        </div>

        <!-- Desktop Navigation -->
        <div class="hidden md:flex space-x-4 items-center">
            <a *ngFor="let item of navItems; trackBy: trackByName" [href]="item.href"
                class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
                {{ item.name }}
            </a>
        </div>

        <!-- Mobile menu button -->
        <div class="md:hidden">
            <button type="button"
                class="hs-collapse-toggle p-2 inline-flex items-center justify-center text-gray-600 hover:text-gray-900 focus:outline-none"
                data-hs-collapse="#mobile-nav" aria-controls="mobile-nav" aria-label="Abrir menú de navegación">
                <lucide-icon [img]="isMenuOpen ? xIcon : menuIcon" class="h-6 w-6"></lucide-icon>
            </button>
        </div>
    </nav>

    <!-- Mobile Navigation -->
    <div id="mobile-nav" class="hs-collapse hidden md:hidden">
        <div class="px-4 pt-4 pb-3 space-y-2 bg-white border-t border-gray-200">
            <a *ngFor="let item of navItems; trackBy: trackByName" [href]="item.href"
                class="block text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-base font-medium"
                (click)="closeMenu()">
                {{ item.name }}
            </a>
        </div>
    </div>
</header>
