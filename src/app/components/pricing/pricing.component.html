<section id="pricing" class="relative py-20 px-4 sm:px-6 lg:px-8 bg-muted/30 overflow-hidden">
    <app-background-elements variant="pricing" />

    <div class="max-w-7xl mx-auto">
        <app-scroll-animation variant="fadeIn" class="text-center mb-16 block">
            <h2 class="text-3xl sm:text-4xl mb-4">Planes y Precios</h2>
            <p class="text-xl text-muted-foreground max-w-3xl mx-auto">
                Elige el plan perfecto para las necesidades de tu negocio
            </p>
        </app-scroll-animation>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto">
            <div *ngFor="let plan of plans; let i = index"
                class="transform transition-all duration-700 ease-out hover:-translate-y-2 hover:scale-[1.02]"
                [class.translate-y-0]="isVisible" [class.opacity-100]="isVisible" [class.translate-y-12]="!isVisible"
                [class.opacity-0]="!isVisible" [style.transition-delay]="(i * 200) + 'ms'">
                <div
                    [class]="plan.popular ? 'relative rounded-2xl h-full border-2 border-primary shadow-xl bg-card' : 'relative rounded-2xl h-full border border-border shadow-lg bg-card'">
                    <div *ngIf="plan.popular"
                        class="absolute -top-4 left-1/2 transform -translate-x-1/2 transition-all duration-500"
                        [class.scale-100]="isPopularVisible" [class.rotate-0]="isPopularVisible"
                        [class.scale-0]="!isPopularVisible" [class.-rotate-180]="!isPopularVisible">
                        <div class="bg-blue-600 text-white px-4 py-2 rounded-full text-sm">
                            Más Popular
                        </div>
                    </div>

                    <!-- Header -->
                    <div class="text-center space-y-4 p-6">
                        <div class="transition-all duration-500" [class.opacity-100]="isVisible"
                            [class.translate-y-0]="isVisible" [class.opacity-0]="!isVisible"
                            [class.translate-y-5]="!isVisible" [style.transition-delay]="(100 + (i * 200)) + 'ms'">
                            <h3 class="text-2xl">{{ plan.name }}</h3>
                        </div>
                        <div class="space-y-2">
                            <div class="flex items-baseline justify-center gap-1 transition-all duration-500"
                                [class.opacity-100]="isVisible" [class.scale-100]="isVisible"
                                [class.opacity-0]="!isVisible" [class.scale-50]="!isVisible"
                                [style.transition-delay]="(200 + (i * 200)) + 'ms'">
                                <span class="text-4xl">{{ plan.price }}</span>
                                <span class="text-gray-600">/{{ plan.period }}</span>
                            </div>
                            <p class="text-gray-600 transition-all duration-500" [class.opacity-100]="isVisible"
                                [class.opacity-0]="!isVisible" [style.transition-delay]="(300 + (i * 200)) + 'ms'">
                                {{ plan.description }}
                            </p>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="space-y-4 px-6">
                        <ul class="space-y-3">
                            <li *ngFor="let feature of plan.features; let j = index"
                                class="flex items-start gap-3 transition-all duration-400"
                                [class.opacity-100]="isVisible" [class.translate-x-0]="isVisible"
                                [class.opacity-0]="!isVisible" [class.-translate-x-5]="!isVisible"
                                [style.transition-delay]="(400 + (i * 200) + (j * 100)) + 'ms'">
                                <div class="transition-transform duration-300 hover:scale-125 hover:rotate-[360deg]">
                                    <svg class="w-5 h-5 text-green-600 flex-shrink-0 mt-0.5" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>
                                <span class="text-gray-700">{{ feature }}</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Footer -->
                    <div class="p-6 mt-6">
                        <button
                            [class]="plan.popular ? 'w-full rounded-xl transition-all duration-200 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 hover:scale-[1.02] active:scale-[0.98]' : 'w-full rounded-xl transition-all duration-200 border border-border bg-background hover:bg-accent text-foreground px-4 py-2 hover:scale-[1.02] active:scale-[0.98]'">
                            Contratar Ahora
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <app-scroll-animation variant="fadeIn" [delay]="0.5" class="text-center mt-12 block">
            <p class="text-gray-600">
                Todos los planes incluyen una prueba gratuita de 30 días. No se requiere tarjeta de crédito.
            </p>
        </app-scroll-animation>
    </div>
</section>
